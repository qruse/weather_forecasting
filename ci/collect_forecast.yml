name: collect-kma-forecast

on:
  schedule:
    # 발표(02,05,...,23 KST = 17,20,...,14 UTC) 직후
    - cron: "20 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python scripts/collect_kma_forecast.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: commit
        run: |
          git config user.name "forecast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/raw/kma_forecast
          git diff --cached --quiet || git commit -m "collect forecast $(date -u +%FT%TZ)"
          git push
